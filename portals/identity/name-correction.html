<!doctype html><html><head><meta charset="utf-8"><title>Identity Services - Name Correction</title></head><body><header><h1>Civic Republic Identity Services</h1></header><main><h2>Name Correction</h2><form id="name-correction-form"><label for="citizen-name">Corrected full name</label><input id="citizen-name" name="full_name" required><button type="button" id="review-button">Review</button><section id="review" hidden><p>Review your corrected name before submission.</p><button type="button" id="submit-button">Submit</button></section><output id="result" aria-live="polite"></output></form></main><script>document.querySelector('#review-button').onclick=()=>document.querySelector('#review').hidden=false;document.querySelector('#submit-button').onclick=()=>{document.querySelector('#result').textContent='Application received'; alert('Done');};</script></body></html>
